# syntax=docker/sandbox-kit:3

schemaVersion: "3"
displayName: OpenCode Agent Sandbox
description: |
  Runnable agent sandbox: the OpenCode workload composed with Docker's
  published github-ssh (public) mixin. Publish as a single OCI reference.
author: atorizva
licenses: [Apache-2.0]
kind: set
version: "1.0.0"

args:
  registry:
    default: ghcr.io/atorizva
    pattern: '^[a-z0-9][a-z0-9._/:-]*$'
    buildArg: KIT_REGISTRY
  tag:
    default: latest
    pattern: '^[A-Za-z0-9._-]+$'
    buildArg: KIT_TAG

kits:
  - ref: ${{ kit.args.registry }}/opencode-workload:${{ kit.args.tag }}
  - ref: sbx/github-ssh:1.1.1
