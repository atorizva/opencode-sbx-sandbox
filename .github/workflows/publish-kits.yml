name: publish-kits

on:
  push:
    branches: [main]

# Serialize releases so two quick pushes cannot compute the same next version.
concurrency:
  group: publish-kits-main
  cancel-in-progress: false

permissions:
  contents: write
  packages: write
  id-token: write

env:
  IMAGE_NS: ghcr.io/atorizva

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Bump version and push tag
        id: tag
        uses: mathieudutour/github-tag-action@af99e60ce8132224b8e6ebab5023449fe256ed46 # v7
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          release_branches: ^main$
          default_bump: patch
          tag_prefix: v
          # Only calculate the version here. The tag is created at the end, so a
          # failed build can be retried without orphaning a tag.
          dry_run: true

      - name: Set up Docker Buildx
        if: steps.tag.outputs.new_tag != ''
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: steps.tag.outputs.new_tag != ''
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install sbx
        if: steps.tag.outputs.new_tag != ''
        run: |
          curl -fsSL https://get.docker.com | sudo REPO_ONLY=1 sh
          sudo apt-get update
          sudo apt-get install -y docker-sbx

      - name: Build and push workload
        if: steps.tag.outputs.new_tag != ''
        run: |
          docker buildx build -f workload/opencode-workload.yaml \
            --platform linux/amd64,linux/arm64 --provenance=mode=min \
            -t "${{ env.IMAGE_NS }}/opencode-workload:latest" \
            -t "${{ env.IMAGE_NS }}/opencode-workload:${{ steps.tag.outputs.new_tag }}" \
            --push workload

      - name: Build and push set
        if: steps.tag.outputs.new_tag != ''
        run: |
          docker buildx build -f set/agent-sandbox.yaml \
            --platform linux/amd64,linux/arm64 --provenance=mode=min \
            --build-arg KIT_REGISTRY="${{ env.IMAGE_NS }}" \
            --build-arg KIT_TAG="${{ steps.tag.outputs.new_tag }}" \
            -t "${{ env.IMAGE_NS }}/opencode-sbx-sandbox:latest" \
            -t "${{ env.IMAGE_NS }}/opencode-sbx-sandbox:${{ steps.tag.outputs.new_tag }}" \
            --push set

      - name: Sign set keyless
        if: steps.tag.outputs.new_tag != ''
        run: |
          sbx kit sign "${{ env.IMAGE_NS }}/opencode-sbx-sandbox:${{ steps.tag.outputs.new_tag }}"
          sbx kit sign "${{ env.IMAGE_NS }}/opencode-sbx-sandbox:latest"

      - name: Create GitHub release
        if: steps.tag.outputs.new_tag != ''
        uses: ncipollo/release-action@339a81892b84b4eeb0f6e744e4574d79d0d9b8dd # v1.21.0
        with:
          tag: ${{ steps.tag.outputs.new_tag }}
          commit: ${{ github.sha }}
          name: ${{ steps.tag.outputs.new_tag }}
          body: |
            Kits published: `${{ env.IMAGE_NS }}/opencode-workload:${{ steps.tag.outputs.new_tag }}` and `${{ env.IMAGE_NS }}/opencode-sbx-sandbox:${{ steps.tag.outputs.new_tag }}`.

            ${{ steps.tag.outputs.changelog }}
          prerelease: ${{ steps.tag.outputs.prerelease == 'true' }}
          skipIfReleaseExists: true
