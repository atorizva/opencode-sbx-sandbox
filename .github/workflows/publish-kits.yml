name: publish-kits

on:
  push:
    branches: [main]

# Serialize releases so two quick pushes cannot compute the same next version.
concurrency:
  group: publish-kits-main
  cancel-in-progress: false

permissions:
  contents: write
  packages: write
  id-token: write

env:
  IMAGE_NS: ghcr.io/atorizva

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compute next version
        id: version
        run: |
          set -euo pipefail

          git fetch --tags --force

          latest=$(git tag --merged HEAD -l 'v*' --sort=-v:refname \
            | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' \
            | head -n1 || true)

          if [[ -z "$latest" ]]; then
            next="1.0.0"
          elif [[ "$(git rev-list -n1 "$latest")" == "$(git rev-parse HEAD)" ]]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "HEAD is already released as $latest; nothing to do."
            exit 0
          else
            range="$latest..HEAD"
            base="${latest#v}"
            IFS=. read -r major minor patch <<< "$base"
            log=$(git log "$range" --format='%B')

            if grep -qE 'BREAKING[ -]CHANGE|^[a-zA-Z]+(\([^)]*\))?!:' <<< "$log"; then
              major=$((major + 1)); minor=0; patch=0
            elif grep -qE '^feat(\([^)]*\))?:' <<< "$log"; then
              minor=$((minor + 1)); patch=0
            else
              patch=$((patch + 1))
            fi

            next="$major.$minor.$patch"
          fi

          echo "skip=false" >> "$GITHUB_OUTPUT"
          echo "version=$next" >> "$GITHUB_OUTPUT"
          echo "tag=v$next" >> "$GITHUB_OUTPUT"
          echo "Next release: v$next"

      - name: Set up Docker Buildx
        if: steps.version.outputs.skip != 'true'
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: steps.version.outputs.skip != 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install sbx
        if: steps.version.outputs.skip != 'true'
        run: |
          curl -fsSL https://get.docker.com | sudo REPO_ONLY=1 sh
          sudo apt-get update
          sudo apt-get install -y docker-sbx

      - name: Build and push workload
        if: steps.version.outputs.skip != 'true'
        run: |
          docker buildx build -f workload/opencode-workload.yaml \
            --platform linux/amd64,linux/arm64 --provenance=mode=min \
            -t "${{ env.IMAGE_NS }}/opencode-workload:latest" \
            -t "${{ env.IMAGE_NS }}/opencode-workload:${{ steps.version.outputs.tag }}" \
            --push workload

      - name: Build and push set
        if: steps.version.outputs.skip != 'true'
        run: |
          docker buildx build -f set/agent-sandbox.yaml \
            --platform linux/amd64,linux/arm64 --provenance=mode=min \
            --build-arg KIT_REGISTRY="${{ env.IMAGE_NS }}" \
            --build-arg KIT_TAG="${{ steps.version.outputs.tag }}" \
            -t "${{ env.IMAGE_NS }}/opencode-sbx-sandbox:latest" \
            -t "${{ env.IMAGE_NS }}/opencode-sbx-sandbox:${{ steps.version.outputs.tag }}" \
            --push set

      - name: Sign set keyless
        if: steps.version.outputs.skip != 'true'
        run: |
          sbx kit sign "${{ env.IMAGE_NS }}/opencode-sbx-sandbox:${{ steps.version.outputs.tag }}"
          sbx kit sign "${{ env.IMAGE_NS }}/opencode-sbx-sandbox:latest"

      - name: Create GitHub release
        if: steps.version.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ steps.version.outputs.tag }}" \
            --target "$GITHUB_SHA" \
            --title "${{ steps.version.outputs.tag }}" \
            --notes "Kits published: \`${{ env.IMAGE_NS }}/opencode-workload:${{ steps.version.outputs.tag }}\` and \`${{ env.IMAGE_NS }}/opencode-sbx-sandbox:${{ steps.version.outputs.tag }}\`." \
            --generate-notes
