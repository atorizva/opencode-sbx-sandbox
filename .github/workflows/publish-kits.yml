name: publish-kits

on:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: read
  packages: write
  id-token: write

env:
  REGISTRY: ghcr.io
  IMAGE_NS: ghcr.io/atorizva

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve kit tag
        id: tag
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            echo "value=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          else
            echo "value=latest" >> "$GITHUB_OUTPUT"
          fi

      - name: Install sbx
        run: |
          curl -fsSL https://get.docker.com | sudo REPO_ONLY=1 sh
          sudo apt-get update
          sudo apt-get install -y docker-sbx

      - name: Build and push workload
        run: |
          docker buildx build -f workload/opencode-workload.yaml \
            --platform linux/amd64,linux/arm64 --provenance=mode=min \
            -t "${{ env.IMAGE_NS }}/opencode-workload:${{ steps.tag.outputs.value }}" \
            --push workload

      - name: Build and push git-ssh-sign mixin
        run: |
          docker buildx build -f mixins/git-ssh-sign/git-ssh-sign.yaml \
            --platform linux/amd64,linux/arm64 --provenance=mode=min \
            -t "${{ env.IMAGE_NS }}/git-ssh-sign:${{ steps.tag.outputs.value }}" \
            --push mixins/git-ssh-sign

      - name: Build and push github-ssh mixin
        run: |
          docker buildx build -f mixins/github-ssh/github-ssh.yaml \
            --platform linux/amd64,linux/arm64 --provenance=mode=min \
            -t "${{ env.IMAGE_NS }}/github-ssh:${{ steps.tag.outputs.value }}" \
            --push mixins/github-ssh

      - name: Build and push set
        run: |
          docker buildx build -f set/agent-sandbox.yaml \
            --platform linux/amd64,linux/arm64 --provenance=mode=min \
            --build-arg KIT_REGISTRY="${{ env.IMAGE_NS }}" \
            --build-arg KIT_TAG="${{ steps.tag.outputs.value }}" \
            -t "${{ env.IMAGE_NS }}/opencode-sbx-sandbox:${{ steps.tag.outputs.value }}" \
            --push set

      - name: Sign set keyless
        run: |
          sbx kit sign "${{ env.IMAGE_NS }}/opencode-sbx-sandbox:${{ steps.tag.outputs.value }}"
